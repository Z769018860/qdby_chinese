<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>汉化资源 · 网盘链接台账</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e6e8ec; --text:#1c1f23; --sub:#6b7280;
    --ok:#0f9d58; --okbg:#e8f6ee; --dead:#e5484d; --deadbg:#fdecec;
    --unk:#b7791f; --unkbg:#fdf4e3; --accent:#2f6feb; --accentbg:#eaf1fe;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
         backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line)}
  .hd{max-width:1180px;margin:0 auto;padding:16px 20px}
  .hd h1{margin:0 0 4px;font-size:19px;font-weight:650;letter-spacing:.2px}
  .hd .sub{color:var(--sub);font-size:12.5px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card .k{font-size:12px;color:var(--sub)}
  .card .v{font-size:22px;font-weight:660;margin-top:2px;font-variant-numeric:tabular-nums}
  .card.ok .v{color:var(--ok)} .card.dead .v{color:var(--dead)} .card.unk .v{color:var(--unk)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .bar input[type=search]{flex:1 1 240px;min-width:180px;padding:9px 12px;border:1px solid var(--line);
       border-radius:9px;background:var(--panel);font-size:13.5px;outline:none}
  .bar input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
  .bar select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13.5px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px;user-select:none;cursor:pointer}
  .game{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .g-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;
          align-items:baseline;flex-wrap:wrap}
  .g-name{font-size:15.5px;font-weight:640}
  .g-meta{color:var(--sub);font-size:12.5px}
  .tag{font-size:11.5px;padding:1px 7px;border-radius:20px;background:#f1f3f6;color:var(--sub)}
  .tag.warn{background:var(--unkbg);color:var(--unk)}
  .g-body{padding:4px 0}
  .row{display:grid;grid-template-columns:96px 1fr 74px 96px 92px;gap:10px;align-items:center;
       padding:9px 16px;border-top:1px solid #f1f3f6;font-size:13px}
  .row:first-child{border-top:0}
  .row:hover{background:#fafbfc}
  .plat{font-size:12.5px;color:#374151}
  .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.3px}
  .pwd{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#374151}
  .src{font-size:12px;color:var(--sub)}
  .badge{font-size:12px;padding:2px 8px;border-radius:20px;text-align:center;white-space:nowrap}
  .badge.ok{background:var(--okbg);color:var(--ok)}
  .badge.dead{background:var(--deadbg);color:var(--dead)}
  .badge.unknown{background:var(--unkbg);color:var(--unk)}
  .detail{grid-column:1/-1;color:var(--sub);font-size:12px;padding-left:0;margin-top:-2px}
  .note{margin:0;padding:9px 16px;background:#fbfbfc;color:#6b7280;font-size:12.5px;border-top:1px solid #f1f3f6}
  .note.warn{background:var(--unkbg);color:#8a5a10}
  .empty{color:var(--sub);text-align:center;padding:40px}
  footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:#9aa1ab;font-size:12px}
  @media(max-width:760px){
    .row{grid-template-columns:1fr 1fr;row-gap:4px}
    .url{grid-column:1/-1;white-space:normal;word-break:break-all}
    .detail{display:none}
  }
</style>
</head>
<body>
<header><div class="hd">
  <h1>汉化资源 · 网盘链接台账</h1>
  <div class="sub">数据取自 B 站发布视频的简介与置顶评论 ｜ 生成时间 __GEN__ ｜ 本页不挂到汉化主页导航</div>
</div></header>

<div class="wrap">
  <div class="cards">
    <div class="card"><div class="k">游戏条目</div><div class="v">__GAMES__</div></div>
    <div class="card"><div class="k">网盘链接</div><div class="v">__TOTAL__</div></div>
    <div class="card ok"><div class="k">有效</div><div class="v">__OK__</div></div>
    <div class="card dead"><div class="k">失效</div><div class="v">__DEAD__</div></div>
    <div class="card unk"><div class="k">待确认</div><div class="v">__UNK__</div></div>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="搜索游戏名 / 视频标题 / 链接…" />
    <select id="plat"><option value="">全部平台</option></select>
    <select id="stat">
      <option value="">全部状态</option>
      <option value="ok">仅有效</option>
      <option value="dead">仅失效</option>
      <option value="unknown">仅待确认</option>
    </select>
    <label class="chk"><input type="checkbox" id="hasdead" /> 只看含失效链接的游戏</label>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的结果</div>
</div>
<footer>链接有效性由脚本于生成时间点自动核验；网盘状态可能随时变化，重要资源建议定期复查。</footer>

<script>
const DATA = __DATA__;
const SOURCE = {desc:"简介", pinned:"置顶评论", up_comment:"评论区补充", article:"专栏正文", site:"站点登记"};
const STATE = {ok:"有效", dead:"失效", unknown:"待确认"};

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const qEl = document.getElementById("q");
const platEl = document.getElementById("plat");
const statEl = document.getElementById("stat");
const deadEl = document.getElementById("hasdead");

(function fillPlatforms(){
  const set = new Set();
  DATA.games.forEach(g => g.links.forEach(l => set.add(l.platform_name)));
  [...set].sort().forEach(p => {
    const o = document.createElement("option"); o.value = p; o.textContent = p; platEl.appendChild(o);
  });
})();

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const q = qEl.value.trim().toLowerCase();
  const plat = platEl.value, stat = statEl.value, onlyDead = deadEl.checked;
  const out = [];
  let shown = 0;

  DATA.games.forEach(g => {
    const links = g.links.filter(l =>
      (!plat || l.platform_name === plat) && (!stat || l.status === stat));
    if (!links.length && (plat || stat)) return;
    if (onlyDead && !g.links.some(l => l.status === "dead")) return;
    const hay = (g.name + " " + (g.video_title || "") + " " + links.map(l => l.url).join(" ")).toLowerCase();
    if (q && !hay.includes(q)) return;
    shown++;

    const metaBits = [];
    if (g.up) metaBits.push("UP：" + esc(g.up));
    if (g.pubdate) metaBits.push(esc(g.pubdate));
    metaBits.push("有效 " + links.filter(l => l.status === "ok").length + " / " + links.length);

    let html = '<div class="game"><div class="g-head"><span class="g-name">' + esc(g.name) + '</span>';
    if (g.bili_url) html += '<a class="g-meta" href="' + esc(g.bili_url) + '" target="_blank" rel="noopener">' + esc(g.video_title || g.bvid) + '</a>';
    else if (g.release_type === "bilibili_article") html += '<a class="g-meta" href="https://www.bilibili.com/read/cv22831035/" target="_blank" rel="noopener">B 站专栏</a>';
    html += '<span class="g-meta">' + metaBits.join(" ｜ ") + '</span>';
    if (g.links.some(l => l.status === "dead")) html += '<span class="tag warn">含失效链接</span>';
    html += '</div>';

    (g.notes || []).forEach(n => { html += '<p class="note">' + esc(n) + '</p>'; });
    (g.warnings || []).forEach(n => { html += '<p class="note warn">⚠️ ' + esc(n) + '</p>'; });

    html += '<div class="g-body">';
    if (!links.length) {
      html += '<p class="note">该条目未提取到网盘链接。</p>';
    }
    links.forEach(l => {
      html += '<div class="row">'
        + '<div class="plat">' + esc(l.platform_name) + '</div>'
        + '<div class="url"><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.url) + '</a></div>'
        + '<div class="pwd">' + (l.pwd ? esc(l.pwd) : "—") + '</div>'
        + '<div class="src">' + esc(SOURCE[l.source] || l.source) + '</div>'
        + '<div class="badge ' + l.status + '" title="' + esc(l.detail || "") + '">' + STATE[l.status] + '</div>'
        + '<div class="detail">' + esc(l.detail || "") + (l.content_hint ? "｜" + esc(l.content_hint) : "") + '</div>'
        + '</div>';
    });
    html += '</div></div>';
    out.push(html);
  });

  listEl.innerHTML = out.join("");
  emptyEl.style.display = shown ? "none" : "block";
}

[qEl, platEl, statEl, deadEl].forEach(el => { el.addEventListener("input", render); el.addEventListener("change", render); });
render();
</script>
</body>
</html>

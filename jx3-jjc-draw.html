<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>剑三 JJC 配置抽签</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#dfe5ee;--accent:#9a3412;--gold:#d99a30;--dps:#b45309;--heal:#047857;--shadow:0 16px 38px rgba(30,41,59,.1)}
    *{box-sizing:border-box}body{margin:0;color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:radial-gradient(circle at 8% 0,#fff2da 0,transparent 32%),radial-gradient(circle at 92% 10%,#e4f5ef 0,transparent 30%),var(--bg)}
    button{font:inherit}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.topbar{padding:22px 0 8px}.back{color:#475569;text-decoration:none}.hero{padding:26px 0 18px}.eyebrow{margin:0 0 8px;color:var(--accent);font-weight:800;letter-spacing:.16em;font-size:12px}.hero h1{font-size:clamp(30px,5vw,50px);margin:0;letter-spacing:.04em}.lead{color:var(--muted);line-height:1.8;margin:10px 0 0}.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.panelHead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}.panel h2{font-size:19px;margin:0}.count{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.miniBtn,.drawBtn{border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;background:#fff;color:#334155;cursor:pointer}.miniBtn:hover{border-color:#94a3b8;background:#f8fafc}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-top:14px}.pick{position:relative;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 8px;cursor:pointer;text-align:center;transition:.15s}.pick:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,41,59,.1)}.pick[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,154,48,.18)}.pick[aria-pressed="false"]{opacity:.42;filter:grayscale(.55)}.pick img,.avatar{width:58px;height:58px;border-radius:14px;display:block;margin:0 auto 8px;background:#eef2f7;object-fit:cover}.pick strong{display:block;font-size:14px}.pick small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.tag{position:absolute;top:7px;right:7px;font-size:10px;padding:3px 6px;border-radius:999px;color:#fff;background:var(--dps)}.tag.healer{background:var(--heal)}.drawPanel{text-align:center;padding:24px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px auto;max-width:650px}.slot{min-height:148px;border:1px dashed #cbd5e1;border-radius:18px;padding:16px 8px;background:linear-gradient(180deg,#fff,#f8fafc);display:flex;flex-direction:column;align-items:center;justify-content:center}.slot .role{font-size:11px;color:var(--muted);margin-bottom:8px}.slot .name{font-weight:800}.slot .full{font-size:12px;color:var(--muted);margin-top:3px}.drawBtn{border:0;background:linear-gradient(135deg,#9a3412,#d97706);color:#fff;font-weight:800;padding:12px 28px;box-shadow:0 8px 20px rgba(180,83,9,.25)}.drawBtn:disabled{opacity:.5;cursor:not-allowed}.notice{min-height:24px;margin:10px 0 0;color:#b91c1c;font-size:13px}.history{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.historyItem{padding:7px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:999px;font-size:12px}.source{font-size:12px;color:var(--muted);line-height:1.7}.source a{color:#475569}.rolling .avatar{animation:pulse .18s infinite alternate}@keyframes pulse{to{transform:scale(.9);opacity:.55}}@media(max-width:640px){.slots{grid-template-columns:1fr}.slot{min-height:110px;display:grid;grid-template-columns:70px 1fr;grid-template-rows:auto auto auto;text-align:left}.slot .avatar{grid-row:1/4;margin:0 12px 0 0}.slot .role{margin:0}.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header class="wrap topbar"><a class="back" href="index.html#toolboxTitle">← 返回个人工具箱</a></header>
  <main class="wrap">
    <section class="hero"><p class="eyebrow">名剑大会 · 3V3</p><h1>剑三 JJC 配置抽签</h1><p class="lead">自己勾选本次抽签范围，随机组成两个不同的输出心法和一个治疗心法。点击心法卡片即可加入或移出抽签池。</p></section>
    <section class="panel drawPanel" aria-labelledby="drawTitle">
      <h2 id="drawTitle">本轮配置</h2>
      <div class="slots" id="slots" aria-live="polite"></div>
      <button class="drawBtn" id="drawBtn" type="button">开始抽签</button>
      <p class="notice" id="notice" role="status"></p>
    </section>
    <section class="panel"><div class="panelHead"><h2>输出心法范围</h2><span class="count" id="dpsCount"></span></div><div class="actions"><button class="miniBtn" data-action="all" data-type="dps">全选输出</button><button class="miniBtn" data-action="none" data-type="dps">清空输出</button><button class="miniBtn" data-action="invert" data-type="dps">反选输出</button></div><div class="grid" id="dpsGrid"></div></section>
    <section class="panel"><div class="panelHead"><h2>治疗心法范围</h2><span class="count" id="healerCount"></span></div><div class="actions"><button class="miniBtn" data-action="all" data-type="healer">全选治疗</button><button class="miniBtn" data-action="none" data-type="healer">清空治疗</button><button class="miniBtn" data-action="invert" data-type="healer">反选治疗</button></div><div class="grid" id="healerGrid"></div></section>
    <section class="panel"><div class="panelHead"><h2>最近抽签</h2><button class="miniBtn" id="clearHistory">清空记录</button></div><div class="history" id="history"></div></section>
    <p class="source">心法名称、分类与图标路径整理自 <a href="https://jx3.unua.top/jjc-stats/" target="_blank" rel="noopener">剑网三 JJC 心法强度统计</a>。本页仅作随机组队娱乐，不代表强度或搭配建议。</p>
  </main>
  <script>
    const BASE='https://jx3.unua.top';
    const specs=[
      ['lijing','奶花','离经易道','万花','healer','naihua'],['zixia','气纯','紫霞功','纯阳','dps','qichun'],['beiao','霸刀','北傲诀','霸刀','dps','badao'],['lingsu','奶药','灵素','药宗','healer','naiyao'],['huajian','花间','花间游','万花','dps','huajian'],['fenshan','苍云','分山劲','苍云','dps','cangyun'],['taixu','剑纯','太虚剑意','纯阳','dps','jianchun'],['zhoutian','段氏','周天功','段氏','dps','duanshi'],['butian','奶毒','补天诀','五毒','healer','naidu'],['bingxin','冰心','冰心诀','七秀','dps','bingxin'],['xiangzhi','奶歌','相知','长歌','healer','naige'],['jingyu','惊羽','惊羽诀','唐门','dps','jingyu'],['fenying','喵子','焚影圣诀','明教','dps','mingjiao'],['wufang','无方','无方','药宗','dps','wufang'],['yunshang','奶秀','云裳心经','七秀','healer','naixiu'],['taixuan','衍天','太玄经','衍天','dps','yantian'],['dujing','毒经','毒经','五毒','dps','dujing'],['gufeng','刀宗','孤锋诀','刀宗','dps','daozong'],['tianluo','田螺','天罗诡道','唐门','dps','tianluo'],['yijin','和尚','易筋经','少林','dps','heshang'],['aoxue','天策','傲血战意','天策','dps','tiance'],['mowen','莫问','莫问','长歌','dps','mowen'],['xiaochen','丐帮','笑尘诀','丐帮','dps','gaibang'],['yinlong','凌雪','隐龙诀','凌雪','dps','lingxue'],['linghai','蓬莱','凌海诀','蓬莱','dps','penglai'],['cangjian','藏剑','问水诀','藏剑','dps','cangjian'],['shanhai','万灵','山海心诀','万灵','dps','wanling'],['youluo','无相','幽罗引','无相','dps','wuxiang']
    ].map(([id,name,full,school,type,icon])=>({id,name,full,school,type,icon:`${BASE}/icons/force/${icon}.png`}));
    const selected=new Set(JSON.parse(localStorage.getItem('jx3DrawPool')||'null')||specs.map(x=>x.id));
    let history=JSON.parse(localStorage.getItem('jx3DrawHistory')||'[]');
    const byId=id=>specs.find(x=>x.id===id); const pool=type=>specs.filter(x=>x.type===type&&selected.has(x.id));
    function card(x){const b=document.createElement('button');b.className='pick';b.type='button';b.dataset.id=x.id;b.setAttribute('aria-pressed',selected.has(x.id));b.innerHTML=`<span class="tag ${x.type}">${x.type==='dps'?'输出':'治疗'}</span><img src="${x.icon}" alt="" loading="lazy"><strong>${x.name}</strong><small>${x.school} · ${x.full}</small>`;b.onclick=()=>{selected.has(x.id)?selected.delete(x.id):selected.add(x.id);savePool();renderPools()};return b}
    function savePool(){localStorage.setItem('jx3DrawPool',JSON.stringify([...selected]))}
    function renderPools(){for(const type of ['dps','healer']){const g=document.querySelector(`#${type}Grid`);g.replaceChildren(...specs.filter(x=>x.type===type).map(card));const n=pool(type).length,total=specs.filter(x=>x.type===type).length;document.querySelector(`#${type}Count`).textContent=`已选 ${n} / ${total}`}}
    function slot(x,label){return `<article class="slot"><div class="role">${label}</div>${x?`<img class="avatar" src="${x.icon}" alt=""><div class="name">${x.name}</div><div class="full">${x.school} · ${x.full}</div>`:'<div class="name">等待抽签</div>'}</article>`}
    function showResult(ids){const xs=ids?.map(byId)||[];document.querySelector('#slots').innerHTML=slot(xs[0],'输出一')+slot(xs[1],'输出二')+slot(xs[2],'治疗')}
    function renderHistory(){const el=document.querySelector('#history');el.innerHTML=history.length?history.map(ids=>`<span class="historyItem">${ids.map(id=>byId(id)?.name).join(' · ')}</span>`).join(''):'<span class="count">还没有抽签记录</span>'}
    document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const ids=specs.filter(x=>x.type===b.dataset.type).map(x=>x.id);if(b.dataset.action==='all')ids.forEach(id=>selected.add(id));if(b.dataset.action==='none')ids.forEach(id=>selected.delete(id));if(b.dataset.action==='invert')ids.forEach(id=>selected.has(id)?selected.delete(id):selected.add(id));savePool();renderPools()});
    document.querySelector('#drawBtn').onclick=()=>{const d=pool('dps'),h=pool('healer'),notice=document.querySelector('#notice');if(d.length<2||h.length<1){notice.textContent='请至少选择 2 个输出心法和 1 个治疗心法。';return}notice.textContent='';const btn=document.querySelector('#drawBtn');btn.disabled=true;document.querySelector('#slots').classList.add('rolling');let ticks=0,timer=setInterval(()=>{const shuffled=[...d].sort(()=>Math.random()-.5);showResult([shuffled[0].id,shuffled[1].id,h[Math.floor(Math.random()*h.length)].id]);if(++ticks>=10){clearInterval(timer);const chosen=[...d].sort(()=>Math.random()-.5).slice(0,2).map(x=>x.id);chosen.push(h[Math.floor(Math.random()*h.length)].id);showResult(chosen);history=[chosen,...history].slice(0,12);localStorage.setItem('jx3DrawHistory',JSON.stringify(history));renderHistory();btn.disabled=false;document.querySelector('#slots').classList.remove('rolling')}},90)};
    document.querySelector('#clearHistory').onclick=()=>{history=[];localStorage.removeItem('jx3DrawHistory');renderHistory()};
    renderPools();showResult(history[0]);renderHistory();
  </script>
</body>
</html>

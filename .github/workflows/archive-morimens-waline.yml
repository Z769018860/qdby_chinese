name: Archive Morimens Waline community data

on:
  schedule:
    # Check daily at 01:37 UTC (09:37 UTC+8); archive only when >=72 hours elapsed.
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 72-hour gate and archive now"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: morimens-waline-community-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL driver
        run: pip install "psycopg[binary]>=3.2,<4"

      - name: Archive approved machine submissions
        env:
          WALINE_DATABASE_URL: ${{ secrets.WALINE_DATABASE_URL }}
          FORCE_ARCHIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          EXTRA=""
          if [ "$FORCE_ARCHIVE" = "true" ]; then EXTRA="--force"; fi
          python scripts/archive_morimens_waline.py archive $EXTRA

      - name: Commit archived data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/morimens/community
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: archive Morimens Waline community data"
            git pull --rebase origin preview
            git push origin HEAD:preview
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete successfully archived machine comments from Waline
        # Cleanup runs only after the repository archive step completed successfully.
        env:
          WALINE_DATABASE_URL: ${{ secrets.WALINE_DATABASE_URL }}
        run: python scripts/archive_morimens_waline.py cleanup

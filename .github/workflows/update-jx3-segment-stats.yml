name: Update JJC segment snapshots
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_jx3_segment_stats.mjs'
      - '.github/workflows/update-jx3-segment-stats.yml'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/update_jx3_segment_stats.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jx3-segment-stats.json
          git diff --cached --quiet || git commit -m "chore: update daily JJC segment stats snapshot"
          git push

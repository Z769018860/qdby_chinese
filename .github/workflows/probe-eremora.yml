name: Probe Eremora Routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_eremora_routes.mjs"
      - "scripts/probe_eremora_leaderboard_data.mjs"
      - "scripts/probe_eremora_browser.mjs"
      - "scripts/probe_eremora_rank_api.mjs"
      - "scripts/probe_eremora_challenge_browser.mjs"
      - ".github/workflows/probe-eremora.yml"

permissions:
  contents: write

concurrency:
  group: probe-eremora
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate probes
        run: |
          node --check scripts/probe_eremora_routes.mjs
          node --check scripts/probe_eremora_leaderboard_data.mjs
          node --check scripts/probe_eremora_browser.mjs
          node --check scripts/probe_eremora_rank_api.mjs
          node --check scripts/probe_eremora_challenge_browser.mjs
      - name: Probe challenge transport
        run: node scripts/probe_eremora_routes.mjs
      - name: Probe leaderboard transport and pagination
        run: node scripts/probe_eremora_leaderboard_data.mjs
      - name: Probe browser assets and load-more source
        run: node scripts/probe_eremora_browser.mjs
      - name: Probe rank API depth
        run: node scripts/probe_eremora_rank_api.mjs
      - name: Probe challenge browser APIs
        run: node scripts/probe_eremora_challenge_browser.mjs
      - name: Commit probe result
        run: |
          if [ -z "$(git status --porcelain -- data/morimens/eremora/route-probe.json data/morimens/eremora/leaderboard-probe.json data/morimens/eremora/browser-probe.json data/morimens/eremora/rank-api-probe.json data/morimens/eremora/challenge-browser-probe.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/morimens/eremora/route-probe.json data/morimens/eremora/leaderboard-probe.json data/morimens/eremora/browser-probe.json data/morimens/eremora/rank-api-probe.json data/morimens/eremora/challenge-browser-probe.json
          git commit -m "chore: refresh Eremora route probes"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          echo "Failed to push probe snapshot after retries." >&2
          exit 1

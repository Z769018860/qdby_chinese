name: Sync Huiji Monsters (browser)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Fetch monster pages through Chromium
        run: xvfb-run -a node scripts/sync_morimens_huiji_browser.mjs
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- data/morimens/huiji/monsters.json)" ]; then echo unchanged; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/morimens/huiji/monsters.json
          git commit -m "chore: refresh Huiji monster pages"
          for a in 1 2 3 4; do git fetch origin "$GITHUB_REF_NAME"; git rebase "origin/$GITHUB_REF_NAME"; git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((a*8)); done
          exit 1

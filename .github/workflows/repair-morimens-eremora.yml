name: Repair Morimens Eremora Missing Details

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-morimens-eremora.yml"
  workflow_dispatch:
    inputs:
      season:
        description: "D-Zone season"
        required: false
        default: "69"
      batch_size:
        description: "Maximum users to retry in this run"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: repair-morimens-eremora
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      EREMORA_REPAIR_SEASON: ${{ github.event.inputs.season || '69' }}
      EREMORA_REPAIR_BATCH: ${{ github.event.inputs.batch_size || '10' }}
      EREMORA_REPAIR_TIMEOUT: "75"
      EREMORA_REPAIR_DELAY_MIN: "6"
      EREMORA_REPAIR_DELAY_MAX: "12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Validate repair inputs
        run: |
          test -s "data/morimens/eremora/rank-index/${EREMORA_REPAIR_SEASON}.json"
          python -m py_compile scripts/repair_morimens_github.py
          python - <<'PY'
          import json, os, pathlib
          season=os.environ['EREMORA_REPAIR_SEASON']
          x=json.loads(pathlib.Path(f'data/morimens/eremora/rank-index/{season}.json').read_text(encoding='utf-8'))
          assert len(x.get('rows',[])) >= 1000, f'incomplete rank index: {len(x.get("rows",[]))}'
          print('rank index:',len(x.get('rows',[])))
          PY

      - name: Repair next batch
        run: python scripts/repair_morimens_github.py

      - name: Recompute Eremora analytics
        continue-on-error: true
        run: node scripts/postprocess_morimens_eremora.mjs

      - name: Show status
        run: |
          python - <<'PY'
          import json, os, pathlib
          season=os.environ['EREMORA_REPAIR_SEASON']
          retry=pathlib.Path(f'data/morimens/eremora/retry-uids/{season}.txt')
          uids=[x.strip() for x in retry.read_text(encoding='utf-8').splitlines() if x.strip()] if retry.exists() else []
          print('remaining retry UIDs:',len(uids))
          p=pathlib.Path(f'data/morimens/eremora/repair-progress/{season}.json')
          if p.exists():
              x=json.loads(p.read_text(encoding='utf-8'))
              print('success this run:',len(x.get('successThisRun',[])))
              print('failed this run:',len(x.get('failedThisRun',[])))
          PY

      - name: Commit successful repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/morimens/eremora/retry-uids" || true
          git add "data/morimens/eremora/raw-repair" || true
          git add "data/morimens/eremora/users" || true
          git add "data/morimens/eremora/seasons" || true
          git add "data/morimens/eremora/stats" || true
          if git diff --cached --quiet; then
            echo "No successful repair data changed in this run; leaving retry state unchanged."
            git restore "data/morimens/eremora/repair-progress" 2>/dev/null || true
            exit 0
          fi
          git add "data/morimens/eremora/repair-progress" || true
          git commit -m "chore: continue Eremora missing-detail repair"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1

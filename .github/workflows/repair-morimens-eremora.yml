name: Repair Morimens Eremora Missing Details

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "D-Zone season"
        required: false
        default: "69"
      batch_size:
        description: "Maximum users to retry in this run"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: repair-morimens-eremora
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      EREMORA_REPAIR_SEASON: ${{ github.event.inputs.season || '69' }}
      EREMORA_REPAIR_BATCH: ${{ github.event.inputs.batch_size || '10' }}
      EREMORA_REPAIR_TIMEOUT: "75"
      EREMORA_REPAIR_DELAY_MIN: "6"
      EREMORA_REPAIR_DELAY_MAX: "12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Validate repair inputs
        run: |
          test -s "data/morimens/eremora/rank-index/${EREMORA_REPAIR_SEASON}.json"
          test -s "data/morimens/eremora/retry-uids/${EREMORA_REPAIR_SEASON}.txt" || true
          python -m py_compile scripts/repair_morimens_github.py

      - name: Repair next batch
        run: python scripts/repair_morimens_github.py

      - name: Recompute Eremora analytics
        continue-on-error: true
        run: node scripts/postprocess_morimens_eremora.mjs

      - name: Show status
        run: |
          python - <<'PY'
          import json, os, pathlib
          season=os.environ['EREMORA_REPAIR_SEASON']
          retry=pathlib.Path(f'data/morimens/eremora/retry-uids/{season}.txt')
          uids=[x.strip() for x in retry.read_text(encoding='utf-8').splitlines() if x.strip()] if retry.exists() else []
          print('remaining retry UIDs:', len(uids))
          p=pathlib.Path(f'data/morimens/eremora/repair-progress/{season}.json')
          if p.exists():
              x=json.loads(p.read_text(encoding='utf-8'))
              print('success this run:', len(x.get('successThisRun',[])))
              print('failed this run:', len(x.get('failedThisRun',[])))
          PY

      - name: Commit repaired data and retry state
        run: |
          if [ -z "$(git status --porcelain -- data/morimens/eremora)" ]; then
            echo "No Eremora repair changes in this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/morimens/eremora
          git commit -m "chore: continue Eremora missing-detail repair"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1

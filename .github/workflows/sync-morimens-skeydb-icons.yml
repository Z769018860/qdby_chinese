name: Sync Morimens SKeyDB icons

on:
  push:
    branches:
      - preview
    paths:
      - ".github/workflows/sync-morimens-skeydb-icons.yml"
      - "scripts/sync_morimens_skeydb_icons.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morimens-skeydb-icons-preview
  cancel-in-progress: false

jobs:
  sync-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned SKeyDB icons
        run: python scripts/sync_morimens_skeydb_icons.py

      - name: Verify local icon set
        run: python scripts/sync_morimens_skeydb_icons.py --check

      - name: Commit local icons
        shell: bash
        run: |
          git add assets/morimens/skeydb-icons
          if git diff --cached --quiet; then
            echo "SKeyDB icons already match the pinned source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: vendor Morimens SKeyDB status icons"
          git push origin HEAD:preview

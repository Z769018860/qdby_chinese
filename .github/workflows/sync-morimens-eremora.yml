name: Sync Morimens Eremora

on:
  workflow_dispatch:
    inputs:
      fetch_from_eremora:
        description: "尝试从 Eremora 联网抓取（Cloudflare 可能拦截 GitHub Actions）"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/discover_eremora_leaderboard.mjs"
      - "scripts/eremora_sveltekit.mjs"
      - "scripts/sync_morimens_eremora.mjs"
      - "scripts/sync_morimens_eremora_rank_index.mjs"
      - "scripts/sync_morimens_eremora_usage.mjs"
      - "scripts/postprocess_morimens_eremora.mjs"
      - ".github/workflows/sync-morimens-eremora.yml"

permissions:
  contents: write

concurrency:
  group: sync-morimens-all
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Eremora sync scripts
        run: |
          node --check scripts/discover_eremora_leaderboard.mjs
          node --check scripts/eremora_sveltekit.mjs
          node --check scripts/sync_morimens_eremora.mjs
          node --check scripts/sync_morimens_eremora_rank_index.mjs
          node --check scripts/sync_morimens_eremora_usage.mjs
          node --check scripts/postprocess_morimens_eremora.mjs
          node --check morimens-dtide.js
      - name: Discover Eremora public data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_from_eremora }}
        continue-on-error: true
        run: node scripts/discover_eremora_leaderboard.mjs
      - name: Sync Eremora structured D-Zone records
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_from_eremora }}
        continue-on-error: true
        env:
          EREMORA_MAX_RECORDS: "1000"
          EREMORA_BATCH_SIZE: "3"
          EREMORA_BATCH_DELAY_MS: "2200"
        run: node scripts/sync_morimens_eremora.mjs
      - name: Precompute detailed rank, difficulty and enlightenment analytics
        continue-on-error: true
        run: node scripts/postprocess_morimens_eremora.mjs
      - name: Use previously synchronized Eremora Top 1000 rank index
        run: |
          test -s data/morimens/eremora/rank-index/69.json
          node -e "const x=require('./data/morimens/eremora/rank-index/69.json'); if((x.rows||[]).length<1000) throw new Error('Cached rank index is incomplete: '+(x.rows||[]).length); console.log('Using cached complete rank index:', x.rows.length)"

      - name: Sync Top 1000 public D-Zone usage records
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_from_eremora }}
        continue-on-error: true
        env:
          EREMORA_USAGE_TARGET: "1000"
          EREMORA_USAGE_SEASONS: "69,68,67,66"
          EREMORA_USAGE_MAX_FETCH: "1000"
          EREMORA_USAGE_BATCH_SIZE: "3"
          EREMORA_USAGE_BATCH_DELAY_MS: "2200"
          EREMORA_USAGE_STALE_DAYS: "7"
          EREMORA_USAGE_CHECKPOINT_EVERY: "8"
        run: node scripts/sync_morimens_eremora_usage.mjs
      - name: Report offline cache coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const season=JSON.parse(fs.readFileSync('data/morimens/eremora/seasons/69.json','utf8'));
          const teams=(season.records||[]).flatMap(r=>(r.waves||[]).flatMap(w=>w.teams||[]));
          const withCreations=teams.filter(t=>Array.isArray(t.creations)&&t.creations.length).length;
          console.log(`Offline cache: records=${season.records?.length||0}, teams=${teams.length}, teamsWithCreations=${withCreations}`);
          if(!teams.length)throw new Error('Cached Eremora season has no teams');
          NODE
      - name: Commit Eremora snapshots
        run: |
          if [ -z "$(git status --porcelain -- data/morimens/eremora)" ]; then
            echo "Eremora snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/morimens/eremora
          git commit -m "chore: refresh Eremora structured leaderboard snapshot"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
          done
          echo "Failed to push Eremora snapshot after retries." >&2
          exit 1

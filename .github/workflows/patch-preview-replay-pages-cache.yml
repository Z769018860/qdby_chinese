name: Patch preview replay Pages cache

on:
  push:
    branches: [preview]
    paths:
      - .github/workflows/patch-preview-replay-pages-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Bump Morimens tools entry version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('morimens-tools.html')
          text = p.read_text(encoding='utf-8')
          old = 'morimens-tools.js?v=20261004.1'
          new = 'morimens-tools.js?v=20261004.7'
          if old not in text and new not in text:
              raise SystemExit('Expected morimens-tools.js version marker not found')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- morimens-tools.html; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morimens-tools.html
          git commit -m 'fix(morimens): bust GitHub Pages replay cache'
          git push origin HEAD:preview

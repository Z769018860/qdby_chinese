name: Sync Morimens Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_morimens_skeydb.mjs"
      - "scripts/sync_morimens_huiji.mjs"
      - "scripts/sync_morimens_huiji_jina.mjs"
      - "scripts/validate_morimens_data.mjs"
      - "data/morimens/huiji/identity.zh-CN.json"
      - "morimens-tools.js"
      - "morimens-data.js"
      - "morimens-skeydb.js"
      - "morimens-i18n.js"
      - "morimens-calculator-skeydb.js"
      - "morimens-calculator-stats.js"
      - "morimens-dtide.js"
      - ".github/workflows/sync-morimens-skeydb.yml"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-morimens-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout SKeyDB source snapshot
        uses: actions/checkout@v4
        with:
          repository: dansa/SKeyDB
          ref: main
          path: .skeydb
          fetch-depth: 1
          sparse-checkout: |
            src/data/public-v3
            src/assets/awk-portraits
            src/assets/awk-cards
            src/assets/wheels
            src/assets/relics
            src/assets/covenants

      - name: Check Morimens sync and frontend scripts
        run: |
          node --check scripts/sync_morimens_skeydb.mjs
          node --check scripts/sync_morimens_huiji_jina.mjs
          node --check scripts/validate_morimens_data.mjs
          node --check morimens-tools.js
          node --check morimens-data.js
          node --check morimens-skeydb.js
          node --check morimens-i18n.js
          node --check morimens-calculator-skeydb.js
          node --check morimens-calculator-stats.js
          node --check morimens-dtide.js

      - name: Sync SKeyDB full public data and assets
        run: node scripts/sync_morimens_skeydb.mjs

      - name: Sync Chinese localization from HuijiWiki
        run: node scripts/sync_morimens_huiji_jina.mjs

      - name: Validate character identity and art mappings
        run: node scripts/validate_morimens_data.mjs

      - name: Commit synchronized snapshots
        run: |
          if [ -z "$(git status --porcelain -- data/morimens/skeydb data/morimens/huiji assets/morimens)" ]; then
            echo "Morimens snapshots are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/morimens/skeydb data/morimens/huiji assets/morimens
          git commit -m "chore: refresh Morimens SKeyDB and Huiji snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
